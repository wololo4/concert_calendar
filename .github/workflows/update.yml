name: Update concert calendar

on:
  schedule:
    - cron: "0 3 * * *"   # Every day at 03:00 UTC
  workflow_dispatch:
    inputs:
      recheck_ticketmaster:
        description: "Re-check every artist's Ticketmaster attraction ID"
        type: boolean
        default: false
  issues:
    types: [edited]       # Rebuild when a ticket box is ticked

permissions:
  contents: write         # Commit the .ics files
  issues: write           # Update the ticket checklist issue

concurrency:
  group: update-calendar
  cancel-in-progress: false

jobs:
  update-calendar:
    runs-on: ubuntu-latest
    # On issue edits, only run for the ticket checklist issue
    if: github.event_name != 'issues' || contains(github.event.issue.labels.*.name, 'tickets')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate concert calendar
        run: xvfb-run -a python merge.py
        env:
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TM_FORCE_RECHECK: ${{ inputs.recheck_ticketmaster && '1' || '' }}

      - name: Save calendar
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add calendars/*.ics
          if [ -f ticketmaster_ids.json ]; then git add ticketmaster_ids.json; fi
          git commit -m "Concert calendar update" || exit 0
          git push
